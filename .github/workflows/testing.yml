name: Testing

on:
  workflow_dispatch:

jobs:
  testing:
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'

    steps:
    - uses: actions/checkout@v6
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libguestfs-tools qemu-utils
    - name: Test images
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        ansible-playbook -e dryrun=true -e guestfs=guestfish ansible/site.yaml -vvv
