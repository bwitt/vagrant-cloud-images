name: Cleanup

on:
  schedule:
  - cron: '45 1 * * 6'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest

    permissions:
      contents: 'write'

    steps:
    - uses: actions/checkout@v6
    - name: Cleanup images
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        ansible-playbook ansible/cleanup.yaml -vvv
