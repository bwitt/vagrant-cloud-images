---
- hosts: localhost
  connection: local
  gather_facts: true
  tasks:
  - name: Load distros data
    include_vars: "../distros.yaml"

  - name: Filter distros data
    include_tasks: filter.yaml

  - include_tasks: cleanup_release.yaml
    loop: "{{ distros|subelements('releases') }}"
    loop_control:
      label: "{{ vagrant_box_name }}"
    vars:
      distro: "{{ item.0 }}"
      release: "{{ item.1 }}"
      vagrant_box_name: "{{ distro.code }}-{{ release.code|default(release.version) }}"
