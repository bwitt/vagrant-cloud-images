---
- name: Build {{ distro.code }}-{{ release.code|default(release.version) }} releases
  set_fact:
    vagrant_box_name: "{{ distro.code }}-{{ release.code|default(release.version) }}"

- name: Get GitHub release {{ vagrant_box_name }}
  include_tasks: github_release.yaml

- name: Create GitHub release {{ vagrant_box_name }}
  when:
  - create|bool
  - gh_release.rc != 0
  command: gh release create {{ vagrant_box_name }} --repo {{ github_repository }} --latest=false --title "{{ vagrant_box_description }}" --notes-file -
  args:
    stdin: "{{ lookup('template', 'description.md.j2') }}"

- name: Update GitHub release {{ vagrant_box_name }} notes
  when:
  - update|bool
  - gh_release.rc == 0
  command: gh release edit {{ vagrant_box_name }} --repo {{ github_repository }} --title "{{ vagrant_box_description }}" --notes-file -
  args:
    stdin: "{{ lookup('template', 'description.md.j2') }}"

- name: Set expiration
  set_fact:
    release_expiration: "{{ release.eol|default(release.eos|default('Dec 2999')) }}"

- include_tasks: arch.yaml
  when:
  - expired|bool or not release_expiration|is_expired
  - filter_arch is not defined or arch.name==filter_arch or arch.type==filter_arch
  loop: "{{ release.arch }}"
  loop_control:
    loop_var: arch

- name: Update Vagrant Box metadata
  when: upload|bool
  include_tasks: metadata.yaml

- name: Skip expired release
  when:
  - not expired|bool and release_expiration|is_expired
  - filter_arch is not defined or arch.name==filter_arch or arch.type==filter_arch
  debug:
    msg: "Skip expired release ({{ release_expiration }})"
  loop: "{{ release.arch }}"
  loop_control:
    loop_var: arch
