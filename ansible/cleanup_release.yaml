---
- name: Get GitHub release {{ vagrant_box_name }}
  ansible.builtin.include_tasks: github_release.yaml

- name: Reset expired versions
  ansible.builtin.set_fact:
    expired_versions: []

- name: Select older versions
  when:
  - version_index >= min_version_retention
  - (now(utc=true) - created_at).days > max_version_days or version_index >= max_version_retention
  ansible.builtin.set_fact:
    expired_versions: "{{ expired_versions + [box_version] }}"
  vars:
    created_at: "{{ box_version.created_at[:19]|to_datetime('%Y-%m-%dT%H:%M:%S') }}"
  loop: "{{ github_release_assets|box_versions(vagrant_box_name) }}"
  loop_control:
    loop_var: box_version
    index_var: version_index
    label: "{{ box_version.version }}"

- name: Delete older versions
  ansible.builtin.command: gh api -X DELETE repos/{{ github_repository }}/releases/assets/{{ asset.id }}
  loop: "{{ expired_versions|map(attribute='assets')|flatten }}"
  loop_control:
    loop_var: asset
    label: "{{ asset.name }}"

- name: Update Vagrant Box metadata
  when: expired_versions|length > 0
  ansible.builtin.include_tasks: metadata.yaml
