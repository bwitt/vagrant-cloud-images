---
- name: Check if {{ vagrant_box_file }} is already released
  when:
  - not overwrite|bool
  - vagrant_box_file in github_release_assets|map(attribute='name')
  ansible.builtin.meta: end_role

- name: Check for already built {{ vagrant_box_file }}
  ansible.builtin.set_fact:
    vagrant_box_exists: "{{ lookup('first_found', files=[vagrant_box_path], errors='ignore') != None }}"

- name: Build {{ vagrant_box_file }}
  when: not vagrant_box_exists
  ansible.builtin.include_tasks: box.yaml

- name: Read Vagrant Box stats
  ansible.builtin.stat:
    path: "{{ vagrant_box_path }}"
    get_checksum: false
  register: vagrant_box

- name: Debug Vagrant Box stats
  ansible.builtin.debug:
    var: vagrant_box
  when: verbose|bool

- name: Upload Vagrant Box {{ vagrant_box_file }} ({{ vagrant_box.stat.size|human_readable }})
  when: upload|bool
  ansible.builtin.command: gh release upload {{ vagrant_box_name }} {{ vagrant_box_path }} --clobber --repo {{ github_repository }}
  register: gh_upload_box
  retries: 3
  delay: 5
  until: gh_upload_box is success

- name: New Vagrant Box for {{ release.description }} uploaded
  when:
  - upload|bool
  - mail_username is defined
  - mail_password is defined
  - mail_from is defined
  - mail_to is defined
  - smtp_server is defined
  - smtp_port is defined
  community.general.mail:
    host: "{{ smtp_server }}"
    port: "{{ smtp_port|int }}"
    username: "{{ mail_username }}"
    password: "{{ mail_password }}"
    from: "{{ mail_from }}"
    to: "{{ mail_to }}"
    subject: "A new Vagrant Box for {{ release.description }} has been uploaded"
    body: |-
      Distro: {{ distro.name }}
      Release: {{ release.name }}
      Provider: {{ provider }}
      Architecture: {{ arch.name }}
      Cloud image: {{ cloud_image_file_name }}
      Cloud version: {{ cloud_image_version_pattern }}
      Vagrant Box file: {{ vagrant_box_file }}
      Vagrant Box version: {{ vagrant_box_version }}

- name: New Vagrant Box for {{ release.description }} uploaded summary
  ansible.builtin.debug:
    msg: |-
      Distro: {{ distro.name }}
      Release: {{ release.name }}
      Provider: {{ provider }}
      Architecture: {{ arch.name }}
      Cloud image: {{ cloud_image_file_name }}
      Cloud version: {{ cloud_image_version_pattern }}
      Vagrant Box file: {{ vagrant_box_file }}
      Vagrant Box version: {{ vagrant_box_version }}

- name: Cleanup build directory
  when: not preserve|bool
  ansible.builtin.file:
    path: "{{ build_path }}/{{ vagrant_box_path }}"
    state: absent
